# Uji di tiga OS: backend (termasuk uji integrasi git), logika UI, dan uji tampilan tanpa layar.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Paket sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Uji tampilan memerlukan `oncode-helper` di samping binary uji (dialog kredensial, rebase).
      - name: Binary pendamping (oncode-helper)
        run: cargo build -p oncode-helper

      # Uji tampilan berjalan tanpa layar (platform uji GPUI), jadi tidak perlu Xvfb.
      # `--no-fail-fast`: semua kegagalan terlihat dalam satu run, tidak berhenti di berkas uji pertama.
      - name: Uji
        run: cargo test --workspace --no-fail-fast

      - name: Build aplikasi
        run: cargo build -p oncode

  # Uji integrasi git terhadap versi minimum yang didukung.
  git-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bangun Git 2.40
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libcurl4-gnutls-dev libexpat1-dev gettext zlib1g-dev
          # Diunduh ke berkas dengan retry: satu koneksi terputus tidak menggagalkan job.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o git-2.40.0.tar.xz https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.40.0.tar.xz
          tar -xJf git-2.40.0.tar.xz
          # GCC 15 (Ubuntu 26.04) memakai C23, yang menjadikan `unreachable` macro bawaan dan
          # bentrok dengan fungsi bernama sama di Git 2.40. Kompilasi dengan C17.
          make -C git-2.40.0 -j"$(nproc)" prefix="$HOME/git-2.40" NO_TCLTK=1 CFLAGS="-g -O2 -std=gnu17" install
          echo "$HOME/git-2.40/bin" >> "$GITHUB_PATH"
      - run: git --version
      # Semua berkas uji dijalankan walau ada yang gagal, supaya semua ketidakcocokan versi terlihat sekaligus.
      - run: cargo test -p oncode-git -p oncode-helper --no-fail-fast
