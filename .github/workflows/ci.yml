# Tests on three OSes: backend (including git integration tests), UI logic, and headless view tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 mesa-vulkan-drivers

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # View tests need `oncode-helper` next to the test binary (credential dialog, rebase).
      - name: Companion binary (oncode-helper)
        run: cargo build -p oncode-helper

      # View tests run headless (the GPUI test platform), so no Xvfb is needed.
      # `--no-fail-fast`: all failures show up in one run instead of stopping at the first failing test file.
      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Build app
        run: cargo build -p oncode

  # Git integration tests against the minimum supported version.
  git-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Git 2.40
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libcurl4-gnutls-dev libexpat1-dev gettext zlib1g-dev
          # Downloaded to a file with retries: a single dropped connection does not fail the job.
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o git-2.40.0.tar.xz https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.40.0.tar.xz
          tar -xJf git-2.40.0.tar.xz
          # GCC 15 (Ubuntu 26.04) uses C23, which makes `unreachable` a built-in macro that
          # clashes with a function of the same name in Git 2.40. Compile with C17.
          make -C git-2.40.0 -j"$(nproc)" prefix="$HOME/git-2.40" NO_TCLTK=1 CFLAGS="-g -O2 -std=gnu17" install
          echo "$HOME/git-2.40/bin" >> "$GITHUB_PATH"
      - run: git --version
      # All test files run even if some fail, so every version mismatch is visible at once.
      - run: cargo test -p oncode-git -p oncode-helper --no-fail-fast
