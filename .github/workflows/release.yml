# Membangun installer untuk tiga OS dari tag rilis dan mengunggahnya sebagai draf rilis.
# Penandatanganan kode memerlukan secret yang disebut di docs/PENGEMBANGAN.md; tanpa itu
# installer tetap dibuat tetapi tidak ditandatangani.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Paket sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # macOS universal: oncode-helper harus tersedia untuk kedua arsitektur dan sebagai binary universal.
      - name: Binary pendamping universal (macOS)
        if: runner.os == 'macOS'
        run: |
          node scripts/build-helper.mjs --release --target=aarch64-apple-darwin
          node scripts/build-helper.mjs --release --target=x86_64-apple-darwin
          lipo -create -output src-tauri/binaries/oncode-helper-universal-apple-darwin \
            src-tauri/binaries/oncode-helper-aarch64-apple-darwin \
            src-tauri/binaries/oncode-helper-x86_64-apple-darwin

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ONCODE_GITHUB_CLIENT_ID: ${{ vars.ONCODE_GITHUB_CLIENT_ID }}
          ONCODE_GITLAB_CLIENT_ID: ${{ vars.ONCODE_GITLAB_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OnCode ${{ github.ref_name }}"
          releaseDraft: true
          args: ${{ matrix.args }}
