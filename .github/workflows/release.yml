# Builds installers for three OSes from a release tag with cargo-packager and uploads them
# as a draft release. macOS signing uses the APPLE_* secrets; without them the installer is still
# built but not signed.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: windows-latest
            formats: nsis
          # Apple Silicon and Intel are built separately on their own runners. `macos-13` has been
          # retired by GitHub; `macos-15-intel` is the last Intel runner (until August 2027).
          - os: macos-latest
            formats: dmg
          - os: macos-15-intel
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # The OAuth client ids are read at compile time (option_env!), so they must be in the build environment.
      - name: Build installer
        working-directory: app
        env:
          ONCODE_GITHUB_CLIENT_ID: ${{ vars.ONCODE_GITHUB_CLIENT_ID }}
          ONCODE_GITLAB_CLIENT_ID: ${{ vars.ONCODE_GITLAB_CLIENT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo packager --release --formats ${{ matrix.formats }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OnCode ${{ github.ref_name }}"
          draft: true
          files: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.exe
            target/packages/*.dmg
