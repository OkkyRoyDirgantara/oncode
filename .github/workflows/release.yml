# Membangun installer untuk tiga OS dari tag rilis dengan cargo-packager dan mengunggahnya
# sebagai draf rilis. Penandatanganan macOS memakai secret APPLE_*; tanpa itu installer tetap
# dibuat tetapi tidak ditandatangani.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: windows-latest
            formats: nsis
          # Apple Silicon dan Intel dibangun terpisah di runner masing-masing.
          - os: macos-latest
            formats: dmg
          - os: macos-13
            formats: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Paket sistem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Pasang cargo-packager
        run: cargo install cargo-packager --locked

      # Client id OAuth dibaca saat kompilasi (option_env!), jadi harus ada di lingkungan build.
      - name: Buat installer
        working-directory: app
        env:
          ONCODE_GITHUB_CLIENT_ID: ${{ vars.ONCODE_GITHUB_CLIENT_ID }}
          ONCODE_GITLAB_CLIENT_ID: ${{ vars.ONCODE_GITLAB_CLIENT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo packager --release --formats ${{ matrix.formats }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "OnCode ${{ github.ref_name }}"
          draft: true
          files: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.exe
            target/packages/*.dmg
