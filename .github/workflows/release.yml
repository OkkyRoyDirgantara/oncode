# Builds installers for three OSes with cargo-packager. From a release tag they are uploaded as a
# draft release; a manual run (Actions → Release → Run workflow) keeps them as workflow artifacts,
# for trying an installer before tagging. The macOS app is signed ad-hoc and not notarized (see
# `[package.metadata.packager.macos]` in app/Cargo.toml).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            formats: deb,appimage
          - os: windows-latest
            formats: nsis
          # Apple Silicon and Intel are built separately on their own runners. `macos-13` has been
          # retired by GitHub; `macos-15-intel` is the last Intel runner (until August 2027).
          # `app` keeps OnCode.app for the signature check; with `dmg` alone cargo-packager deletes it.
          - os: macos-latest
            formats: app,dmg
          - os: macos-15-intel
            formats: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwayland-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-dev libfontconfig-dev libfreetype-dev libssl-dev \
            libvulkan1 file

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      # The OAuth client ids are read at compile time (option_env!), so they must be in the build environment.
      # No APPLE_* variables: cargo-packager would try to notarize the ad-hoc signed app with them.
      - name: Build installer
        working-directory: app
        env:
          ONCODE_GITHUB_CLIENT_ID: ${{ vars.ONCODE_GITHUB_CLIENT_ID }}
          ONCODE_GITLAB_CLIENT_ID: ${{ vars.ONCODE_GITLAB_CLIENT_ID }}
        run: cargo packager --release --formats ${{ matrix.formats }}

      # An app without a valid signature is "damaged" to macOS once downloaded: stop here instead of shipping it.
      - name: Check macOS signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict --verbose=2 target/packages/OnCode.app
          codesign --display --verbose=2 target/packages/OnCode.app

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: "OnCode ${{ github.ref_name }}"
          draft: true
          files: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.exe
            target/packages/*.dmg

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            target/packages/*.deb
            target/packages/*.AppImage
            target/packages/*.exe
            target/packages/*.dmg
