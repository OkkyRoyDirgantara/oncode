[package]
name = "oncode-ui-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Graph commit, detail commit, interactive rebase, reflog, worktree, dan submodule untuk OnCode"

[dependencies]
oncode-core = { path = "../oncode-core" }
oncode-ui = { path = "../oncode-ui" }
gpui-kit = "=0.10.0"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
oncode-git = { path = "../oncode-git" }
oncode-ui-diff = { path = "../oncode-ui-diff" }

[dev-dependencies]
oncode-ui = { path = "../oncode-ui", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
tempfile.workspace = true
