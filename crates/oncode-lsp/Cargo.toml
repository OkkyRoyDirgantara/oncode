[package]
name = "oncode-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OnCode LSP: language server process manager, JSON-RPC framing over stdio, and LSP protocol client"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The same version that gpui-component uses for the editor's LSP hooks.
lsp-types = { version = "0.97", features = ["proposed"] }

[dev-dependencies]
oncode-lsp = { path = ".", features = ["mock"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
# Mock language server (`oncode_lsp::mock`) for this crate's tests and view tests.
mock = []

[[example]]
name = "mock_lsp_server"
required-features = ["mock"]
