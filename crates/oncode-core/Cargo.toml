[package]
name = "oncode-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OnCode application state without UI: repository registry, per-window workspace, settings, persisted data, and the entire command API"

[dependencies]
oncode-git = { path = "../oncode-git" }
oncode-workspace = { path = "../oncode-workspace" }
oncode-terminal = { path = "../oncode-terminal" }
oncode-lsp = { path = "../oncode-lsp" }
oncode-forge = { path = "../oncode-forge" }
oncode-ai = { path = "../oncode-ai" }
oncode-format = { path = "../oncode-format" }

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
# Per-OS config and data directory locations, same as what Tauri used in v0.2.
dirs = "6"

[dev-dependencies]
tempfile.workspace = true
# Mock HTTP server for the forge login tests.
wiremock = "0.6"
