[package]
name = "oncode-git"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OnCode Git layer: git CLI runner, parsers, model, graph layout"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tempfile.workspace = true
uuid = { version = "1", features = ["v4"] }
# Conflicted files are read with the encoding the editor would use (see `conflict.rs`).
encoding_rs = "0.8"
chardetng = "1"

[dev-dependencies]
proptest = "1"
insta = "1"
