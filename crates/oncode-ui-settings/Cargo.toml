[package]
name = "oncode-ui-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tampilan pengaturan untuk OnCode"

[dependencies]
oncode-core = { path = "../oncode-core" }
oncode-ui = { path = "../oncode-ui" }
# Hanya untuk tipe yang muncul di `Settings`: `PullStrategy` dan `ServerSpec`.
oncode-git = { path = "../oncode-git" }
oncode-lsp = { path = "../oncode-lsp" }
gpui-kit = "=0.10.0"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
oncode-ui = { path = "../oncode-ui", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
tempfile.workspace = true
