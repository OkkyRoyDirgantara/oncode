[package]
name = "oncode-ui-search"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Project-wide text search and replace for OnCode"

[dependencies]
oncode-core = { path = "../oncode-core" }
oncode-ui = { path = "../oncode-ui" }
gpui-kit = "=0.10.0"
serde.workspace = true
serde_json.workspace = true
oncode-workspace = { path = "../oncode-workspace" }
tokio.workspace = true
# The same regex engine as the backend (`oncode-workspace`), so replacements in the editor are identical.
grep-matcher = "0.1"
grep-regex = "0.1"
# The same version as `oncode-ui`; used to edit `EditorState` (`apply_lsp_edits`).
lsp-types = { version = "0.97", features = ["proposed"] }

[dev-dependencies]
oncode-ui = { path = "../oncode-ui", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
tempfile.workspace = true
