[package]
name = "oncode-ui-search"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pencarian dan penggantian teks di seluruh proyek untuk OnCode"

[dependencies]
oncode-core = { path = "../oncode-core" }
oncode-ui = { path = "../oncode-ui" }
gpui-kit = "=0.10.0"
serde.workspace = true
serde_json.workspace = true
oncode-workspace = { path = "../oncode-workspace" }
tokio.workspace = true
# Mesin regex yang sama dengan backend (`oncode-workspace`), agar penggantian di editor identik.
grep-matcher = "0.1"
grep-regex = "0.1"
# Versi yang sama dengan `oncode-ui`; dipakai untuk menyunting `EditorState` (`apply_lsp_edits`).
lsp-types = { version = "0.97", features = ["proposed"] }

[dev-dependencies]
oncode-ui = { path = "../oncode-ui", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
tempfile.workspace = true
