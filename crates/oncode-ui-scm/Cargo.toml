[package]
name = "oncode-ui-scm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Panel Source Control, commit, branch, remote, stash, dan Git Output untuk OnCode"

[dependencies]
oncode-core = { path = "../oncode-core" }
oncode-ui = { path = "../oncode-ui" }
gpui-kit = "=0.10.0"
serde.workspace = true
serde_json.workspace = true
# Saluran progres dari thread backend ke thread utama.
tokio.workspace = true
# Jam setempat untuk cap waktu Git Output; sudah ada di pohon dependensi lewat gpui-component.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
oncode-git = { path = "../oncode-git" }
oncode-ui-diff = { path = "../oncode-ui-diff" }

[dev-dependencies]
oncode-ui = { path = "../oncode-ui", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
tempfile.workspace = true
# Claude API tiruan untuk uji "Generate Commit Message".
wiremock = "0.6"
