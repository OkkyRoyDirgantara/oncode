[package]
name = "oncode-ui-scm"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Source Control panel, commit, branch, remote, stash, and Git Output for OnCode"

[dependencies]
oncode-core = { path = "../oncode-core" }
oncode-ui = { path = "../oncode-ui" }
gpui-kit = "=0.10.0"
serde.workspace = true
serde_json.workspace = true
# Progress channel from the backend thread to the main thread.
tokio.workspace = true
# Local clock for Git Output timestamps; already in the dependency tree via gpui-component.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
oncode-git = { path = "../oncode-git" }
oncode-ui-diff = { path = "../oncode-ui-diff" }

[dev-dependencies]
oncode-ui = { path = "../oncode-ui", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
tempfile.workspace = true
# Mock Claude API for the "Generate Commit Message" tests.
wiremock = "0.6"
