[package]
name = "oncode-forge"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "GitHub and GitLab integration for OnCode: REST client, device flow login, token storage in the OS keychain"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# TLS via rustls (no OpenSSL / native-tls). In reqwest 0.13 `form` and `query`
# are separate features; `system-proxy` keeps the system proxy honored.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "form", "query", "system-proxy"] }
# The `v1` feature selects each OS's native store: Keychain (macOS), Credential Manager
# (Windows), and Secret Service via the pure-Rust zbus (Linux/*nix, no libdbus).
keyring = { version = "4", default-features = false, features = ["v1"] }

[dev-dependencies]
wiremock = "0.6"
