[package]
name = "oncode-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Helper program called by git: credential helper, askpass and editor"

[dependencies]
serde_json.workspace = true

# Modifies the user's PATH in the registry for the `oncode` command (see src/shell_command.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
oncode-git = { path = "../oncode-git" }
tokio.workspace = true
tempfile.workspace = true
