[package]
name = "oncode-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Claude API client for OnCode: writes commit messages from the staged diff"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Same as oncode-forge: TLS through rustls, the system proxy is honored. The stream is read with
# `Response::chunk()`, so the `stream` feature is not needed.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "system-proxy"] }

[dev-dependencies]
tokio.workspace = true
wiremock = "0.6"
