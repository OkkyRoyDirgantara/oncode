[package]
name = "oncode-ui-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Diff view with per-hunk/line staging, conflict editor, change markers, and blame for OnCode"

[dependencies]
oncode-core = { path = "../oncode-core" }
oncode-ui = { path = "../oncode-ui" }
gpui-kit = "=0.10.0"
serde.workspace = true
serde_json.workspace = true
oncode-git = { path = "../oncode-git" }
# Already in Cargo.lock (used by other dependencies); used for line diffs.
similar = "2"

[dev-dependencies]
oncode-ui = { path = "../oncode-ui", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
tempfile.workspace = true
