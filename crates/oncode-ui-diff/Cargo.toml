[package]
name = "oncode-ui-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Tampilan diff dengan staging per hunk/baris, editor konflik, penanda perubahan, dan blame untuk OnCode"

[dependencies]
oncode-core = { path = "../oncode-core" }
oncode-ui = { path = "../oncode-ui" }
gpui-kit = "=0.10.0"
serde.workspace = true
serde_json.workspace = true
oncode-git = { path = "../oncode-git" }
# Sudah ada di Cargo.lock (dipakai dependensi lain); dipakai untuk diff baris.
similar = "2"

[dev-dependencies]
oncode-ui = { path = "../oncode-ui", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
tempfile.workspace = true
