[package]
name = "oncode"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OnCode: editor kode ringan dengan Git client lengkap"
default-run = "oncode"

[lib]
name = "oncode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "oncode"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
oncode-git = { path = "../crates/oncode-git" }
oncode-workspace = { path = "../crates/oncode-workspace" }
oncode-terminal = { path = "../crates/oncode-terminal" }
oncode-lsp = { path = "../crates/oncode-lsp" }
oncode-forge = { path = "../crates/oncode-forge" }

tauri = { version = "2", features = ["specta"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta.workspace = true
specta-typescript = "=0.0.15"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile.workspace = true

[features]
# Jangan dihapus: dipakai Tauri untuk build produksi.
custom-protocol = ["tauri/custom-protocol"]
