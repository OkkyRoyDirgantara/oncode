[workspace]
resolver = "2"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "fs", "net"] }
tokio-util = "0.7"
tempfile = "3"

# Dependencies (GPUI and friends) are built without debug info: the debug binary shrinks from ± 780 MB
# and link time gets much shorter. Our own code still has line numbers in backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
