[package]
name = "oncode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OnCode: a native code editor with a full Git client"

# The binary is deliberately not named "oncode". The Intel D3D11 driver picks a shader cache file (in
# %USERPROFILE%\AppData\LocalLow\Intel\ShaderCache) by the length of the exe name, then loads all of
# its contents into process memory when the device is created. A 6-letter name shares a cache with
# chrome.exe and msedge.exe: "oncode.exe" takes ± 186 MB in Task Manager with no folder open, "oncode-app.exe"
# ± 40 MB (measured on Intel UHD, driver 30.0.101.1371). Avoid 6-letter exe names.
[[bin]]
name = "oncode-app"
path = "src/main.rs"

[dependencies]
oncode-core = { path = "../crates/oncode-core" }
oncode-forge = { path = "../crates/oncode-forge" }
oncode-git = { path = "../crates/oncode-git" }
oncode-ui = { path = "../crates/oncode-ui" }
oncode-ui-explorer = { path = "../crates/oncode-ui-explorer" }
oncode-ui-search = { path = "../crates/oncode-ui-search" }
oncode-ui-diff = { path = "../crates/oncode-ui-diff" }
oncode-ui-scm = { path = "../crates/oncode-ui-scm" }
oncode-ui-graph = { path = "../crates/oncode-ui-graph" }
oncode-ui-terminal = { path = "../crates/oncode-ui-terminal" }
oncode-ui-lsp = { path = "../crates/oncode-ui-lsp" }
oncode-ui-forge = { path = "../crates/oncode-ui-forge" }
oncode-ui-settings = { path = "../crates/oncode-ui-settings" }
oncode-ui-markdown = { path = "../crates/oncode-ui-markdown" }
gpui-kit = "=0.10.0"
tokio.workspace = true
serde_json.workspace = true

# User uid for the single-process socket name (src/single_instance.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Application icon for Windows (used by Explorer, the taskbar, and installer shortcuts).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
oncode-ui = { path = "../crates/oncode-ui", features = ["test-support"] }
gpui-kit = { version = "=0.10.0", features = ["test-support"] }

# Installers are built with `cargo packager --release` (see docs/DEVELOPMENT.md).
# `oncode-helper` is installed next to the main binary; that is where the app looks for it.
[package.metadata.packager]
product-name = "OnCode"
# Placeholder value: replace it with your own domain before a public release, because changing it
# after a release moves the location of user data.
identifier = "dev.oncode.editor"
description = "A simple native code editor with a full Git client"
category = "DeveloperTool"
before-packaging-command = "cargo build --release -p oncode -p oncode-helper"
binaries = [{ path = "oncode-app", main = true }, { path = "oncode-helper" }]
icons = ["icons/32x32.png", "icons/64x64.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]
out-dir = "../target/packages"

[package.metadata.packager.deb]
depends = ["git", "libxkbcommon-x11-0", "libvulkan1"]
# The default entry plus StartupWMClass, so the dock shows OnCode's name and icon. Also used for the AppImage.
desktop-template = "packaging/linux/oncode.desktop"
# The `oncode .` command in the terminal. Must be executable in git (`git add --chmod=+x`).
files = { "packaging/linux/oncode" = "usr/bin/oncode" }

[package.metadata.packager.nsis]
installer-icon = "icons/icon.ico"
# The `oncode .` command in the terminal: `bin\oncode.cmd` and the user PATH, handled by oncode-helper
# (see crates/oncode-helper/src/shell_command.rs). This section runs before the application files are
# copied, so the helper is first extracted to the installer's temporary folder. On uninstall, the `un.`
# section runs before the files are removed.
preinstall-section = '''
!searchreplace ONCODE_HELPER_SRC "${MAINBINARYSRCPATH}" "${MAINBINARYNAME}.exe" "oncode-helper.exe"
Section ShellCommand
  InitPluginsDir
  File "/oname=$PLUGINSDIR\oncode-helper.exe" "${ONCODE_HELPER_SRC}"
  nsExec::Exec '"$PLUGINSDIR\oncode-helper.exe" install-shell-command "$INSTDIR"'
  Pop $0
SectionEnd
Section un.ShellCommand
  nsExec::Exec '"$INSTDIR\oncode-helper.exe" uninstall-shell-command "$INSTDIR"'
  Pop $0
SectionEnd
'''

[package.metadata.packager.macos]
# Ad-hoc signature, since there is no Apple Developer ID yet. Without any signature, macOS calls a
# downloaded app "damaged" and offers no way to open it; with an ad-hoc one it says it could not
# verify the app, and System Settings → Privacy & Security offers "Open Anyway". cargo-packager signs
# with the hardened runtime and then notarizes only if APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are
# set (empty values count as set), which ad-hoc builds must not do. A Developer ID's name replaces
# "-" here: cargo-packager does not read APPLE_SIGNING_IDENTITY.
signing-identity = "-"
